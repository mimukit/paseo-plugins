home: docs/wiki
engine: none
pages:
  - path: index.md
    mode: none
    documents: [README.md, "plugins/*/paseo-plugin.json"]
  - path: getting-started.md
    mode: tutorial
    documents: ["plugins/*/paseo-plugin.json", "plugins/*/package.json", "plugins/*/index.client.tsx", "plugins/*/index.server.ts", "plugins/*/client/*.tsx"]
  - path: how-to/add-a-plugin.md
    mode: how-to
    documents: [AGENTS.md, README.md, IDEAS.md, "plugins/*/package.json"]
  - path: how-to/install-a-plugin.md
    mode: how-to
    documents: ["plugins/*/paseo-plugin.json"]
  - path: architecture.md
    mode: explanation
    documents: ["plugins/*/index.client.tsx", "plugins/*/index.server.ts", "plugins/*/shared/*.ts"]
  - path: reference.md
    mode: reference
    documents: ["plugins/*/paseo-plugin.json", "plugins/*/package.json", "plugins/*/tsconfig.json"]
  - path: plugin-readme-template.md
    mode: reference
    documents: ["plugins/*/README.md"]
